    normalized_records: processed/foodml_texture_prediction_2023_review.jsonl
    notes: >-
      Tables A3 and A4 supply process metadata and texture summaries for the
      same 30 pea/faba records already included in FoodML. The crosswalk maps
      FoodML sample numbers 25-54 to Table A4 IDs 1-30 using study/group,
      material, target moisture, hardness, and chewiness; the articles do not
