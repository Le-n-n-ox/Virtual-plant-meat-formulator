  - id: foodml-texture-prediction-2023
    name: Predicting the Textural Properties of Plant-Based Meat Analogs with Machine Learning
    publisher: Foods (MDPI) and authors' FoodML repository
    version: "2023"
    doi: 10.3390/foods12020344
    urls:
      - https://pmc.ncbi.nlm.nih.gov/articles/PMC9858592/
      - https://github.com/sezinata/FoodML
    local_file: reference/foodml_texture_prediction_2023.csv
    sha256: 03ad4b42a70c9ab375a602c22a786b4367e616c0fac271ebab5cd7a805148efa
    license_status: cc_by_4_0_article_and_supplement
    import_status: 54_sample_review_imported_hme_and_mechanical_elongation_separated
    normalized_file: processed/foodml_texture_prediction_2023_review.jsonl
    notes: >-
      The curated CSV has 54 sample rows: 42 high-moisture extrusion (30 pea/faba
      isolate/concentrate and 12 soy/wheat-gluten) and 12 mechanical-elongation
      samples. The importer preserves process mode, group/study IDs, seven
      composition/moisture inputs, hardness and chewiness targets, source rows,
      and the CSV checksum. A source-cited crosswalk adds Table A3/A4 process
      settings to the 30 Ferawati rows in place; it adds no duplicate samples.
      The row mapping is inferred because the papers provide no shared sample
      IDs, the g-to-N factor is inferred from exact target agreement, and the
      final FBI-local moisture value conflicts between Tables A3 and A4. The
      article's reported Ridge errors (hardness
      10.101 N RMSE / 22.9% MAPE; chewiness 6.035 N RMSE / 14.5% MAPE) are for
      the mixed dataset and are not HME-only or Kenyan validation. The 30
      pea/faba samples originate from Ferawati et al. (2021) and must not be
      counted twice as separate rows. The paper and supplement are CC BY 4.0;
      the repository MIT license applies to code.
      Underlying source-study attribution is retained in every imported row.

