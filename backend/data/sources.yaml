    license_status: reuse_terms_not_confirmed
    import_status: excel_export_available_exact_market_row_and_reuse_terms_unverified
    notes: >-
      The prototype target is Nairobi Wakulima Market, wholesale, KES/kg.
      The public market page provides an Excel export with commodity,
      classification, grade, market, wholesale/retail, supply volume, county,
      and date fields. Unit is embedded in each price string (for example,
      /Kg), and currency has no separate field; retain the raw string and do
      not assume a currency until the source documents it. The Ministry
      bulletin describes daily, weekly, and monthly updates, but a current
      Nairobi Wakulima row has not been verified. No official API documentation
      or dataset-specific license was found. Keep cost optimization unavailable
      until a fresh matching export is reviewed and reuse terms are established.
