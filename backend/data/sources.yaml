  - id: kamis-kenya-market-prices
    name: Kenya Agricultural Market Information System
    publisher: Kenya Ministry of Agriculture and Livestock Development
    urls:
      - https://kamis.kilimo.go.ke/site/market/1280
      - https://kilimo.go.ke/wp-content/uploads/2024/12/Kilimo-Bulletin-Issue-II-December.pdf
