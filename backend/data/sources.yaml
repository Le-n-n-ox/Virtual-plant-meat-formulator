schema_version: 1
retrieved_on: 2026-11-14
amino_acid_default_pattern: null
pricing_defaults:
  market: null
  county: Nairobi
  preferred_exact_market: Wakulima (Nairobi)
  price_type: null
  currency: KES
  exact_form_product_fallback:
    max_record_age_days: 30
    require_same_crop_identity: true
    require_same_ingredient_form: true
    require_explicit_net_mass: true
    derive_unit_price_only_from_listed_pack_price_and_net_mass: true
    display_label: packaged retail product reference
    use_as_bulk_or_wholesale_price: false
    use_for_raw_crop_input_estimate: false
    distribution_status: local_research_reference_only_until_terms_reviewed
    precedence: before_raw_crop_market_proxies_for_same_ingredient_form
    note: >-
      Prefer a current, direct retailer listing with the same crop identity and
      ingredient form when its net pack mass and listed price are explicit.
      Preserve the product brand, origin, pack size, and retailer. Report it as
      a packaged retail reference, not a generic, bulk, or wholesale price.
      It may include brand, processing, packaging, and retail premiums.
  unit_basis: price_per_kg_only_when_derived_from_an_explicit_mass_unit
  exact_market_max_age_days: 90
  other_nairobi_market_fallback:
    source_ids:
      - wfp-kenya-market-prices
      - kamis-kenya-market-prices
    geography: named_market_in_Nairobi
    source_rules:
      - source_id: wfp-kenya-market-prices
        max_record_age_days: 90
        require_price_flag: actual
        require_price_type: Wholesale
        display_label_template: raw-crop wholesale estimate from {market_name}, Nairobi
      - source_id: kamis-kenya-market-prices
        require_observation_month: current_calendar_month
        require_price_type: Retail
        require_named_market: true
        display_label_template: raw-crop retail estimate from {market_name}, Nairobi ({observation_period})
        research_prototype_only_until_reuse_terms_are_confirmed: true
    display_label_template: raw-crop input estimate from {market_name}, Nairobi
    may_be_reported_as_wakulima_quote: false
    scope_note: >-
      Use a matching actual wholesale WFP observation from another explicitly
      named Nairobi market, or a matching current-month KAMIS retail observation
      from a named Nairobi market via SAFIC AgriIntel, only when no fresh exact
      Wakulima record exists. Preserve the source, price level, market name,
      and observation period; never relabel them as Wakulima or a county average.
  form_proxy:
    allow_raw_crop_input_estimate_for_processed_forms: true
    eligible_ingredient_forms:
      - flour
      - soaked
      - cooked
    display_label: raw-crop input cost estimate
    require_source_form_to_be_disclosed: false
    preserve_source_form_uncertainty: true
    includes_processing_yield_or_losses: false
    includes_milling_cooking_or_other_processing_costs: false
    require_same_crop_identity: true
    note: >-
      A crop commodity price may be shown against a processed ingredient only
      as a raw-crop input cost estimate. Preserve whether the source form was
      actually stated; do not describe it as the purchase price of flour,
      soaked, or cooked ingredient. No yield adjustment, processing losses,
      or processing costs are included.
  fallback:
    source_id: kenya-agri-atlas-market-prices
    geography: Nairobi county average
    display_label: Nairobi county average estimate
    max_record_age_days: 42
    price_basis: wholesale_where_available_otherwise_retail_as_published
    require_proxy_label: true
    may_be_reported_as_wakulima_quote: false
  selection_note: >-
    Prefer an exact crop-and-form product listing no older than 30 days when
    its listed pack price and net mass are explicit; report it as a packaged
    retail product reference. It is not a bulk/raw-material price. Otherwise
    prefer a matching actual wholesale Wakulima (Nairobi) WFP record no older
    than 90 days. If none exists, use a matching actual wholesale WFP record
    from another named Nairobi market no older than 90 days. If no such WFP
    record exists, a matching current-month named-market KAMIS retail record
    may be used for the non-commercial research prototype, labelled retail
    with the market and month; source reuse rights remain unconfirmed. If
    neither is available, use a matching Nairobi county average from Kenya
    Agri Atlas no older than 42 days, labelled as a county estimate and
    preserving its published price basis. Never present another market or a
    county proxy as a Wakulima quote. If no fresh source match or comparable
    unit exists, leave cost unavailable.
sources:
  - id: kfct-2018
    name: Kenya Food Composition Tables 2018
    publisher: Government of Kenya and FAO
    version: "2018"
    urls:
      - https://www.fao.org/food-composition/tables-and-databases/detail/kenya-food-composition-tables/en
      - https://nutrition.health.go.ke/programmes/healthy-diets-physical/food-composition-tables/
      - https://familyhealth.go.ke/wp-content/uploads/2019/05/Final-Food-compostion-book-2018.pdf
    pdf_local_file: raw/kenya_food_composition_tables_2018.pdf
    workbook_local_file: raw/Kenya Food Composition Tables Excel files 2018.xlsx
    workbook_sha256: c9be0519f23c6a8f703251a2844a228a2ba297fad9be6f812e65159b90589273
    expected_food_count: 522
    expected_recipe_count: 142
    license_status: noncommercial_research_with_acknowledgement
    import_status: workbook_imported_review_required_count_discrepancy
    demo_ingredient_crosswalk_file: processed/kfct2018_demo_ingredient_crosswalk_2026-11-14.csv
    demo_ingredient_crosswalk_status: exact_and_near_match_food_records_reviewed
    notes: >-
      The workbook copyright notice permits copying, downloading, and printing
      for private study, research, teaching, and non-commercial products or
      services with appropriate acknowledgement. Resale and other commercial
      use require FAO permission. The corrected import finds 517 food rows and
      141 recipe rows after preserving 15066r and 15066s. Five food rows and
      one recipe row remain unexplained against the published 522 plus 142;
      reconcile before activation.
      Generated output is a review candidate, not validated production data.
      The local demo crosswalk finds exact crop/form records for amaranth flour
      (1002) and finger-millet flour (1026). Sorghum flour is available only
      as separate red (1038) and white (1040) entries; there is no generic
      sorghum profile. Cowpea and Bambara flour have dry/raw crop entries only.
      The generic green-gram flour lacks an exact record: KFCT's Gram, Flour
      entry (3018) is Vigna mungo (black gram), whereas its green gram entry
      (3019) is Vigna radiata dry/raw. KFCT has soaked-and-boiled pigeon-pea
      entries but not a soaked-uncooked standalone entry. It has no standalone
      cooked lablab food row; Njahi recipes 15059 and 15062 are mixed dishes.
      None of the selected numeric amino-acid fields is present in the listed
      exact/near-match ingredient records, even though selected amino acids
      exist for other foods in the full table. Preserve the matches, gaps, and
      variety/form distinctions; do not fill missing nutrient values with 0.

