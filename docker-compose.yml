name: virtual-plant-meat-formulator

services:
  redis:
    image: redis:8.10.3-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    image: virtual-plant-meat-formulator-backend:0.1.0
    build:
      context: ./backend
    # Apply schema migrations only; the Supabase database already contains migrated data.
    command: ["sh", "-c", "echo 'Migrations skipped'"]
    environment: &backend-environment
      ENV: development
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to the Supabase pooler URI in .env}
      # Point DATABASE_URL at the transaction-mode pooler (port 6543) for the
      # API and worker, and MIGRATE_DATABASE_URL at session mode (5432) for
      # Alembic. Defaults to DATABASE_URL when unset, which is correct for a
      # plain local Postgres.
      MIGRATE_DATABASE_URL: ${MIGRATE_DATABASE_URL:-}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-3}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-2}
      REDIS_URL: redis://redis:6379/0
      JOB_RUNNER: celery
      EVENT_BUS: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:-dev-only-change-me}
      STREAM_TOKEN_TTL_SECONDS: ${STREAM_TOKEN_TTL_SECONDS:-60}
      GIT_SHA: ${GIT_SHA:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      NVIDIA_BASE_URL: ${NVIDIA_BASE_URL:-https://integrate.api.nvidia.com/v1}
      NVIDIA_MODEL: ${NVIDIA_MODEL:-}
      AUTH_MODE: ${AUTH_MODE:-local}
      LOCAL_JWT_SECRET: ${LOCAL_JWT_SECRET:-dev-only-local-jwt-secret-not-for-production}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-devpassword123}
      MODEL_ARTIFACT_DIR: /app/artifacts/models
      EXPORT_DIR: /app/artifacts/exports
      DATA_DIR: /app/data
    volumes: &backend-volumes
      - model-artifacts:/app/artifacts
      # Read-only view of curated datasets (processed/ stays local and git-ignored)
      - ./backend/data:/app/data:ro
    restart: "no"

  api:
    image: virtual-plant-meat-formulator-backend:0.1.0
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    volumes: *backend-volumes
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    image: virtual-plant-meat-formulator-backend:0.1.0
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=${LOG_LEVEL:-INFO}", "--concurrency=1"]
    restart: unless-stopped
    environment: *backend-environment
    volumes: *backend-volumes
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.jobs.celery_app:celery_app inspect ping --timeout=3 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    image: virtual-plant-meat-formulator-frontend:0.1.0
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  model-artifacts:
