name: virtual-plant-meat-formulator

services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vpmf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-virtual_plant_meat_formulator}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 768M

  redis:
    image: redis:8.10.3-alpine3.23
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  migrate:
    image: virtual-plant-meat-formulator-backend:0.1.0
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment: &backend-environment
      ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-vpmf}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-virtual_plant_meat_formulator}
      REDIS_URL: redis://redis:6379/0
      JOB_RUNNER: celery
      EVENT_BUS: redis
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:${FRONTEND_PORT:-3000}}
      STREAM_TOKEN_SECRET: ${STREAM_TOKEN_SECRET:-dev-only-change-me}
      STREAM_TOKEN_TTL_SECONDS: ${STREAM_TOKEN_TTL_SECONDS:-60}
      GIT_SHA: ${GIT_SHA:-dev}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    image: virtual-plant-meat-formulator-backend:0.1.0
    build:
      context: ./backend
    restart: unless-stopped
    environment: *backend-environment
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  worker:
    image: virtual-plant-meat-formulator-backend:0.1.0
    build:
      context: ./backend
    command: ["celery", "-A", "app.jobs.celery_app:celery_app", "worker", "--loglevel=${LOG_LEVEL:-INFO}", "--concurrency=1"]
    restart: unless-stopped
    environment: *backend-environment
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A app.jobs.celery_app:celery_app inspect ping --timeout=3 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 768M

  frontend:
    image: virtual-plant-meat-formulator-frontend:0.1.0
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:${API_PORT:-8000}}
        NEXT_PUBLIC_USE_MOCKS: ${NEXT_PUBLIC_USE_MOCKS:-false}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G

volumes:
  postgres-data:
