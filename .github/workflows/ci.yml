name: CI

on:
  pull_request:
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.8"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --locked --dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest
      - name: Migrations apply from an empty database
        run: uv run alembic upgrade head
        env:
          DATABASE_URL: sqlite:///./ci-migration-check.db
      - name: Export the OpenAPI contract
        run: >-
          uv run python -c "import json; from app.main import create_app;
          print(json.dumps(create_app().openapi(), indent=2, sort_keys=True))"
          > openapi.json
      - name: Publish the OpenAPI contract
        uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: backend/openapi.json

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start stack and verify endpoints
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then docker compose logs; fi
            docker compose down -v
            exit "$status"
          }
          trap cleanup EXIT
          docker compose up --build -d --wait
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 http://localhost:8000/api/health
          curl --fail --retry 20 --retry-connrefused --retry-delay 2 -I http://localhost:3000
