name: virtual-plant-meat-formulator-ci

services:
  db:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./.github/postgres-ci-init.sql:/docker-entrypoint-initdb.d/00-create-api-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    depends_on:
      db:
        condition: service_healthy
